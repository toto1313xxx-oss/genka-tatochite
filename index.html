<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="原価符牒計算">
  <title>原価符牒計算機</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0f172a; color: #f8fafc; padding: 14px; min-height: 100vh; }
    .container { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    
    /* ヘッダー */
    .header-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .title { font-size: 14px; font-weight: bold; color: #94a3b8; white-space: nowrap; }
    .header-actions { display: flex; gap: 6px; }
    .btn-header { background: #334155; border: 1px solid #475569; color: #f8fafc; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
    .btn-header.highlight { background: #0284c7; border-color: #38bdf8; color: #fff; }

    /* ロット設定 */
    .lot-card { background: #1e293b; border-radius: 14px; padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border: 1px solid #334155; }
    .input-group label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 4px; font-weight: bold; }
    .input-group input { width: 100%; background: #0f172a; border: 1px solid #475569; color: #f8fafc; padding: 10px; border-radius: 8px; font-size: 18px; font-weight: bold; text-align: right; }

    /* 品目グリッド */
    .section-title { font-size: 12px; color: #94a3b8; font-weight: bold; margin-bottom: 4px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    
    /* 品目ボタン */
    .item-btn { border-radius: 10px; padding: 12px 10px; text-align: left; cursor: pointer; transition: all 0.15s ease; border: 2px solid transparent; }
    .item-btn.active { border-color: #ffffff; box-shadow: 0 0 14px rgba(255, 255, 255, 0.5); transform: scale(1.02); }
    .item-name { font-size: 14px; font-weight: bold; color: #ffffff; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
    .item-rate { font-size: 11px; color: rgba(255,255,255,0.85); margin-top: 2px; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }

    /* 重量入力 */
    .weight-card { background: #1e293b; border-radius: 14px; padding: 12px; border: 1px solid #334155; }
    .weight-box { position: relative; display: flex; align-items: center; }
    .weight-input { width: 100%; background: #0f172a; border: 1px solid #475569; color: #38bdf8; padding: 10px 60px 10px 12px; border-radius: 8px; font-size: 26px; font-weight: bold; text-align: right; }
    .unit-text { position: absolute; right: 40px; font-size: 16px; color: #94a3b8; font-weight: bold; pointer-events: none; }
    .btn-inline-clear { position: absolute; right: 8px; background: #334155; border: none; color: #94a3b8; width: 28px; height: 28px; border-radius: 50%; font-size: 14px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; }

    /* 結果カード */
    .result-card { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-radius: 16px; padding: 14px; border: 2px solid #fbbf24; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .result-sub { font-size: 12px; color: #94a3b8; margin-bottom: 2px; }
    .result-values { font-size: 15px; color: #e2e8f0; margin-bottom: 8px; }
    .result-values span { font-weight: bold; color: #38bdf8; }
    .cipher-label { font-size: 11px; font-weight: bold; color: #fbbf24; letter-spacing: 2px; }
    .cipher-badge { font-size: 40px; font-weight: 900; color: #fbbf24; letter-spacing: 6px; text-shadow: 0 0 16px rgba(251, 191, 36, 0.4); min-height: 50px; line-height: 50px; }

    /* 次へボタン */
    .btn-next { width: 100%; background: #2563eb; border: none; color: #ffffff; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
    .btn-next:active { background: #1d4ed8; }

    /* モーダル共通 */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; padding: 10px; overflow-y: auto; }
    .modal-content { max-width: 480px; margin: 0 auto; background: #1e293b; border-radius: 16px; padding: 14px; border: 1px solid #475569; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .modal-title { font-size: 15px; font-weight: bold; color: #f8fafc; }
    .btn-close { background: transparent; border: none; color: #94a3b8; font-size: 22px; font-weight: bold; cursor: pointer; padding: 4px; }

    /* 相互変換タブ */
    .conv-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
    .tab-btn { background: #0f172a; border: 1px solid #334155; color: #94a3b8; padding: 8px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; text-align: center; }
    .tab-btn.active { background: #0284c7; border-color: #38bdf8; color: #ffffff; }

    /* ディスプレイ表示 */
    .conv-display { background: #0f172a; border: 1px solid #475569; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
    .conv-disp-top { font-size: 11px; color: #94a3b8; margin-bottom: 2px; }
    .conv-disp-val { font-size: 24px; font-weight: bold; color: #f8fafc; text-align: right; min-height: 32px; word-break: break-all; }
    .conv-disp-res { font-size: 28px; font-weight: 900; color: #fbbf24; text-align: right; min-height: 38px; border-top: 1px dashed #334155; margin-top: 6px; padding-top: 4px; }

    /* テンキーグリッド */
    .keypad-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .keypad-grid-3col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .key-btn { background: #334155; border: 1px solid #475569; color: #f8fafc; padding: 12px 0; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; text-align: center; user-select: none; }
    .key-btn:active { background: #475569; transform: scale(0.96); }
    .key-btn.prefix { background: #854d0e; border-color: #eab308; color: #fef08a; } /* プレフィックス */
    .key-btn.sub { font-size: 11px; color: #cbd5e1; font-weight: normal; display: block; margin-top: -2px; }
    .key-btn.fn { background: #dc2626; color: #ffffff; }
    .key-btn.accent { background: #2563eb; color: #ffffff; }

    /* マスタ編集用 */
    .master-row { display: grid; grid-template-columns: 1fr 85px 44px; gap: 6px; margin-bottom: 8px; align-items: center; }
    .master-row input { width: 100%; background: #0f172a; border: 1px solid #475569; color: #f8fafc; padding: 8px 6px; border-radius: 6px; font-size: 13px; }
    .master-row input.rate { text-align: right; }
    .btn-del { width: 100%; height: 35px; background: #dc2626; border: none; color: #fff; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .btn-add-item { width: 100%; background: #334155; border: 1px dashed #64748b; color: #93c5fd; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: bold; margin-top: 8px; cursor: pointer; }
    .btn-save-master { width: 100%; background: #16a34a; border: none; color: #fff; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; margin-top: 12px; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <!-- ヘッダー -->
  <div class="header-bar">
    <div class="title">原価符牒計算機</div>
    <div class="header-actions">
      <button class="btn-header highlight" onclick="openConvModal()">🔢 テンキー変換</button>
      <button class="btn-header" onclick="openMasterModal()">⚙️ マスタ</button>
    </div>
  </div>

  <!-- ロット設定 -->
  <div class="lot-card">
    <div class="input-group">
      <label>総買値 (千円)</label>
      <input type="number" id="buyPrice" value="100" inputmode="numeric" oninput="calculate()">
    </div>
    <div class="input-group">
      <label>全体見積り (千円)</label>
      <input type="number" id="lotEstimate" value="200" inputmode="numeric" oninput="calculate()">
    </div>
  </div>

  <!-- 品目グリッド -->
  <div>
    <div class="section-title">品目（高単価: 赤 ↔ 低単価: 青）</div>
    <div class="grid" id="itemGrid"></div>
  </div>

  <!-- 重量入力 -->
  <div class="weight-card">
    <div class="section-title">はかりの計量値</div>
    <div class="weight-box">
      <input type="number" id="weight" class="weight-input" placeholder="0" inputmode="decimal" oninput="calculate()">
      <span class="unit-text">g</span>
      <button class="btn-inline-clear" onclick="clearWeight()">✕</button>
    </div>
  </div>

  <!-- 結果カード -->
  <div class="result-card">
    <div class="result-sub">個別見積り / 確定原価</div>
    <div class="result-values">
      見積: <span id="indivEst">0</span> 千円 ｜ 原価: <span id="finalCost">0</span> 千円 (<span id="actualYen">0</span>円)
    </div>
    <div class="cipher-label">確定原価 符牒コード</div>
    <div class="cipher-badge" id="cipherCode">----</div>
  </div>

  <button class="btn-next" onclick="clearWeight()">次の品物を測る（クリア）</button>
</div>

<!-- 相互変換モーダル（オリジナルテンキー搭載） -->
<div class="modal" id="convModal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">相互変換テンキー</div>
      <button class="btn-close" onclick="closeConvModal()">✕</button>
    </div>
    
    <!-- タブ切り替え -->
    <div class="conv-tabs">
      <button class="tab-btn active" id="tabPriceToCipher" onclick="switchConvMode('priceToCipher')">価格 ➔ 符牒</button>
      <button class="tab-btn" id="tabCipherToPrice" onclick="switchConvMode('cipherToPrice')">符牒 ➔ 価格</button>
    </div>

    <!-- ディスプレイ -->
    <div class="conv-display">
      <div class="conv-disp-top" id="dispLabel">入力した価格（円）</div>
      <div class="conv-disp-val" id="dispInput">0</div>
      <div class="conv-disp-res" id="dispOutput">----</div>
    </div>

    <!-- ① 価格 -> 符牒用 テンキー -->
    <div id="keypadPrice" class="keypad-grid-3col">
      <button class="key-btn" onclick="pressNum('7')">7</button>
      <button class="key-btn" onclick="pressNum('8')">8</button>
      <button class="key-btn" onclick="pressNum('9')">9</button>
      <button class="key-btn" onclick="pressNum('4')">4</button>
      <button class="key-btn" onclick="pressNum('5')">5</button>
      <button class="key-btn" onclick="pressNum('6')">6</button>
      <button class="key-btn" onclick="pressNum('1')">1</button>
      <button class="key-btn" onclick="pressNum('2')">2</button>
      <button class="key-btn" onclick="pressNum('3')">3</button>
      <button class="key-btn fn" onclick="pressClear()">C</button>
      <button class="key-btn" onclick="pressNum('0')">0</button>
      <button class="key-btn" onclick="pressNum('00')">00</button>
    </div>

    <!-- ② 符牒 -> 価格用 オリジナル符牒テンキー -->
    <div id="keypadCipher" style="display:none; flex-direction:column; gap:6px;">
      <!-- プレフィックス行 -->
      <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:6px;">
        <button class="key-btn prefix" onclick="pressCipher('テ')">テ<span class="sub">100万</span></button>
        <button class="key-btn prefix" onclick="pressCipher('チ')">チ<span class="sub">10万</span></button>
        <button class="key-btn prefix" onclick="pressCipher('ト')">ト<span class="sub">1万</span></button>
        <button class="key-btn prefix" onclick="pressCipher('タ')">タ<span class="sub">千</span></button>
      </div>
      <!-- 符牒数字グリッド -->
      <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:6px;">
        <button class="key-btn" onclick="pressCipher('ヒ')">ヒ<span class="sub">1</span></button>
        <button class="key-btn" onclick="pressCipher('コ')">コ<span class="sub">2</span></button>
        <button class="key-btn" onclick="pressCipher('ト')">ト<span class="sub">3</span></button>
        <button class="key-btn" onclick="pressCipher('ニ')">ニ<span class="sub">4</span></button>
        <button class="key-btn" onclick="pressCipher('サ')">サ<span class="sub">5</span></button>
        <button class="key-btn" onclick="pressCipher('カ')">カ<span class="sub">6</span></button>
        <button class="key-btn" onclick="pressCipher('エ')">エ<span class="sub">7</span></button>
        <button class="key-btn" onclick="pressCipher('ル')">ル<span class="sub">8</span></button>
        <button class="key-btn" onclick="pressCipher('ウ')">ウ<span class="sub">9</span></button>
        <button class="key-btn fn" onclick="pressClear()">C</button>
        <button class="key-btn" onclick="pressCipher('チ')">チ<span class="sub">0</span></button>
        <button class="key-btn accent" onclick="pressCipher('オ')">オ<span class="sub">連続</span></button>
      </div>
    </div>
  </div>
</div>

<!-- マスタ編集モーダル -->
<div class="modal" id="masterModal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">品目・単価マスタ編集</div>
      <button class="btn-close" onclick="closeMasterModal()">✕</button>
    </div>
    <div id="masterList"></div>
    <button class="btn-add-item" onclick="addNewMasterRow()">＋ 新しい品目を追加</button>
    <button class="btn-save-master" onclick="saveMasterData()">変更を保存して反映</button>
  </div>
</div>

<script>
  const defaultItems = [
    { name: '象牙バングル大', rate: 250 },
    { name: '象牙アクセSS', rate: 200 },
    { name: '象牙バングル小', rate: 200 },
    { name: 'マッコウ', rate: 150 },
    { name: '象牙アクセS', rate: 140 },
    { name: '象牙アクセA', rate: 70 },
    { name: '象牙アクセB', rate: 45 },
    { name: 'コツネリ', rate: 3 }
  ];

  let items = JSON.parse(localStorage.getItem('app_master_items')) || defaultItems;
  let selectedRate = items[0] ? items[0].rate : 0;

  function getRateColor(rate, minRate, maxRate) {
    if (maxRate === minRate) return 'linear-gradient(135deg, #1e3a8a, #2563eb)';
    const ratio = Math.min(Math.max((rate - minRate) / (maxRate - minRate), 0), 1);
    const hue = Math.round((1 - ratio) * 225); 
    return `linear-gradient(135deg, hsl(${hue}, 80%, 32%), hsl(${hue}, 85%, 22%))`;
  }

  function renderGrid() {
    const grid = document.getElementById('itemGrid');
    grid.innerHTML = '';
    const rates = items.map(i => i.rate);
    const minRate = Math.min(...rates);
    const maxRate = Math.max(...rates);

    items.forEach((item) => {
      const btn = document.createElement('button');
      btn.className = `item-btn ${item.rate === selectedRate ? 'active' : ''}`;
      btn.style.background = getRateColor(item.rate, minRate, maxRate);
      btn.innerHTML = `<div class="item-name">${item.name}</div><div class="item-rate">${item.rate} 千円/kg</div>`;
      btn.onclick = () => {
        document.querySelectorAll('.item-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedRate = item.rate;
        calculate();
      };
      grid.appendChild(btn);
    });
  }

  const map = { '1':'ヒ', '2':'コ', '3':'ト', '4':'ニ', '5':'サ', '6':'カ', '7':'エ', '8':'ル', '9':'ウ', '0':'チ' };
  const revMap = { 'ヒ':'1', 'コ':'2', 'ト':'3', 'ニ':'4', 'サ':'5', 'カ':'6', 'エ':'7', 'ル':'8', 'ウ':'9', 'チ':'0' };
  const prefixDigitLen = { 'テ': 7, 'チ': 6, 'ト': 5, 'タ': 4 };

  function getCipher(priceYen) {
    if (!priceYen || priceYen < 1000) return "----";
    const num = Math.floor(priceYen);

    let prefix = "";
    if (num >= 1000000) prefix = "テ";
    else if (num >= 100000) prefix = "チ";
    else if (num >= 10000) prefix = "ト";
    else if (num >= 1000) prefix = "タ";

    const digits = String(num);
    const trimmed = digits.replace(/0+$/, '');

    if (trimmed.length === 1 && digits.length >= 4) {
      return (prefix + map[trimmed] + "オ").slice(0, 4);
    }

    let res = [];
    let i = 0;
    while (i < trimmed.length) {
      let ch = trimmed[i];
      let count = 1;
      while (i + 1 < trimmed.length && trimmed[i + 1] === ch) {
        count++;
        i++;
      }
      if (count >= 2) {
        res.push(map[ch]);
        res.push("オ");
        break;
      } else {
        res.push(map[ch]);
      }
      i++;
      if (res.length >= 3) break;
    }

    return (prefix + res.join("")).slice(0, 4);
  }

  function decodeCipher(cipherStr) {
    const s = cipherStr.trim();
    if (!s) return "----";
    const first = s[0];
    if (!prefixDigitLen[first]) return "頭文字:テ/チ/ト/タ";

    const targetLen = prefixDigitLen[first];
    const body = s.slice(1);

    if (body.length === 2 && body[1] === 'オ' && revMap[body[0]]) {
      const numStr = revMap[body[0]].padEnd(targetLen, '0');
      return Number(numStr).toLocaleString() + " 円";
    }

    let digits = [];
    for (let i = 0; i < body.length; i++) {
      const ch = body[i];
      if (ch === 'オ') {
        if (digits.length > 0) digits.push(digits[digits.length - 1]);
      } else if (revMap[ch]) {
        digits.push(revMap[ch]);
      }
    }

    let numStr = digits.join('');
    if (!numStr) return "コードを入力";
    numStr = numStr.padEnd(targetLen, '0').slice(0, targetLen);
    return Number(numStr).toLocaleString() + " 円";
  }

  function calculate() {
    const buyPrice = parseFloat(document.getElementById('buyPrice').value) || 0;
    const lotEstimate = parseFloat(document.getElementById('lotEstimate').value) || 0;
    const weight = parseFloat(document.getElementById('weight').value) || 0;

    const indivEst = selectedRate * (weight / 1000);
    const cost = (lotEstimate > 0) ? indivEst * (buyPrice / lotEstimate) : 0;
    const actualYen = Math.round(cost * 1000);

    document.getElementById('indivEst').textContent = indivEst.toFixed(1);
    document.getElementById('finalCost').textContent = cost.toFixed(1);
    document.getElementById('actualYen').textContent = actualYen.toLocaleString();
    document.getElementById('cipherCode').textContent = getCipher(actualYen);
  }

  function clearWeight() {
    const input = document.getElementById('weight');
    input.value = '';
    calculate();
    input.focus();
  }

  /* テンキー相互変換モード制御 */
  let currentConvMode = 'priceToCipher';
  let curInputStr = '';

  function openConvModal() {
    document.getElementById('convModal').style.display = 'block';
    switchConvMode('priceToCipher');
  }
  function closeConvModal() {
    document.getElementById('convModal').style.display = 'none';
  }

  function switchConvMode(mode) {
    currentConvMode = mode;
    curInputStr = '';
    
    const tabPrice = document.getElementById('tabPriceToCipher');
    const tabCipher = document.getElementById('tabCipherToPrice');
    const keypadPrice = document.getElementById('keypadPrice');
    const keypadCipher = document.getElementById('keypadCipher');
    const dispLabel = document.getElementById('dispLabel');

    if (mode === 'priceToCipher') {
      tabPrice.classList.add('active');
      tabCipher.classList.remove('active');
      keypadPrice.style.display = 'grid';
      keypadCipher.style.display = 'none';
      dispLabel.textContent = '入力した価格（円）';
      document.getElementById('dispInput').textContent = '0';
      document.getElementById('dispOutput').textContent = '----';
    } else {
      tabCipher.classList.add('active');
      tabPrice.classList.remove('active');
      keypadPrice.style.display = 'none';
      keypadCipher.style.display = 'flex';
      dispLabel.textContent = '入力した符牒コード';
      document.getElementById('dispInput').textContent = '未入力';
      document.getElementById('dispOutput').textContent = '---- 円';
    }
  }

  function pressNum(digit) {
    if (curInputStr.length >= 8) return;
    if (curInputStr === '' && (digit === '0' || digit === '00')) return;
    curInputStr += digit;
    
    document.getElementById('dispInput').textContent = Number(curInputStr).toLocaleString() + ' 円';
    document.getElementById('dispOutput').textContent = getCipher(Number(curInputStr));
  }

  function pressCipher(char) {
    if (curInputStr.length >= 4) return; // 4文字制限
    curInputStr += char;

    document.getElementById('dispInput').textContent = curInputStr;
    document.getElementById('dispOutput').textContent = decodeCipher(curInputStr);
  }

  function pressClear() {
    curInputStr = '';
    if (currentConvMode === 'priceToCipher') {
      document.getElementById('dispInput').textContent = '0';
      document.getElementById('dispOutput').textContent = '----';
    } else {
      document.getElementById('dispInput').textContent = '未入力';
      document.getElementById('dispOutput').textContent = '---- 円';
    }
  }

  /* マスタ編集モーダル */
  function openMasterModal() {
    const list = document.getElementById('masterList');
    list.innerHTML = '';
    items.forEach(item => list.appendChild(createMasterRow(item.name, item.rate)));
    document.getElementById('masterModal').style.display = 'block';
  }
  function closeMasterModal() { document.getElementById('masterModal').style.display = 'none'; }

  function createMasterRow(name = '', rate = '') {
    const div = document.createElement('div');
    div.className = 'master-row';
    div.innerHTML = `
      <input type="text" class="name" placeholder="品目名" value="${name}">
      <input type="number" class="rate" placeholder="単価" value="${rate}">
      <button class="btn-del" onclick="this.parentElement.remove()">✕</button>
    `;
    return div;
  }

  function addNewMasterRow() { document.getElementById('masterList').appendChild(createMasterRow()); }

  function saveMasterData() {
    const rows = document.querySelectorAll('.master-row');
    const newItems = [];
    rows.forEach(row => {
      const name = row.querySelector('.name').value.trim();
      const rate = parseFloat(row.querySelector('.rate').value) || 0;
      if (name) newItems.push({ name, rate });
    });

    if (newItems.length === 0) {
      alert('最低1つの品目を設定してください');
      return;
    }

    items = newItems;
    localStorage.setItem('app_master_items', JSON.stringify(items));
    selectedRate = items[0].rate;
    renderGrid();
    calculate();
    closeMasterModal();
  }

  renderGrid();
</script>
</body>
</html>
